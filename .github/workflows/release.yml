name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-appimage:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            linuxdeploy_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            linuxdeploy_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            cmake \
            desktop-file-utils \
            g++ \
            libgl1-mesa-dev \
            patchelf \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-qmake \
            wget
      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arch="${{ matrix.linuxdeploy_arch }}"

          desktop-file-validate assets/io.github.sysadmindoc.rclonebrowserng.desktop
          appstreamcli validate --no-net assets/io.github.sysadmindoc.rclonebrowserng.metainfo.xml

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build

          cp README.md AppDir/Readme.md
          cp CHANGELOG.md AppDir/Changelog.md
          cp LICENSE AppDir/License.txt

          mkdir -p tools release
          scripts/fetch_linuxdeploy_tools.sh "$arch" tools

          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD/tools:$PATH"
          export VERSION="$version"
          export UPDATE_INFORMATION="gh-releases-zsync|SysAdminDoc|RcloneBrowserNG|latest|RcloneBrowserNG-*-linux-${{ matrix.arch }}.AppImage.zsync"
          "tools/linuxdeploy-${arch}.AppImage" \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/io.github.sysadmindoc.rclonebrowserng.desktop \
            --plugin qt \
            --output appimage

          appimage="$(find . -maxdepth 1 -name '*.AppImage' -type f | head -n 1)"
          test -n "$appimage"
          mv "$appimage" "release/RcloneBrowserNG-${version}-linux-${{ matrix.arch }}.AppImage"
      - name: Smoke test packaged binary
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          output="$(release/RcloneBrowserNG-*-linux-${{ matrix.arch }}.AppImage --version 2>&1)"
          echo "Smoke output: $output"
          echo "$output" | grep -q "Rclone Browser NG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: release/*

  macos-dmg:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15
            arch: x86_64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: brew install qt@6
      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          qt_prefix="$(brew --prefix qt@6)"

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$qt_prefix" ${{ matrix.cmake_extra }}
          cmake --build build --parallel

          app="build/build/rclone-browser.app"
          "$qt_prefix/bin/macdeployqt" "$app" -dmg -verbose=2

          mkdir -p release
          mv "build/build/rclone-browser.dmg" \
            "release/RcloneBrowserNG-${version}-macos-${{ matrix.arch }}.dmg"
          ditto -c -k --keepParent "$app" \
            "release/RcloneBrowserNG-${version}-macos-${{ matrix.arch }}.app.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/*

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.*'
          arch: win64_msvc2019_64
      - name: Validate Qt version
        shell: pwsh
        run: ./scripts/validate_qt_version.ps1 -QtDir "$env:Qt6_DIR"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes
      - name: Build Windows packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }
          $name = "RcloneBrowserNG-$version-windows-x64"
          $dist = Join-Path $PWD "release\$name"

          cmake -S . -B build -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          cmake --build build --config Release

          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item README.md "$dist\Readme.md"
          Copy-Item CHANGELOG.md "$dist\Changelog.md"
          Copy-Item LICENSE "$dist\License.txt"
          Copy-Item build\build\Release\RcloneBrowser.exe $dist
          Copy-Item build\build\Release\RcloneBrowserPassword.exe $dist

          windeployqt --no-translations "$dist\RcloneBrowser.exe"

          $zip = Join-Path $PWD "release\$name.zip"
          Compress-Archive -Path $dist -DestinationPath $zip -Force

          Push-Location scripts
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/dMyAppVersion=$version" `
            "/dMyAppId={{0AF9BF43-8D44-4AFF-AE60-6CECF1BF0D31}" `
            "/dMyAppDir=$name" `
            "/dMyAppArch=x64" `
            "/O..\release" `
            "/F$name-setup" `
            "rclone-browser-win-installer.iss"
          Pop-Location
      - name: Smoke test packaged binary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          $exe = "release\RcloneBrowserNG-$version-windows-x64\RcloneBrowser.exe"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $output = & $exe --version 2>&1
          Write-Host "Smoke output: $output"
          if ($output -notmatch 'Rclone Browser NG') { throw 'Smoke test failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-x64
          path: |
            release/*.zip
            release/*.exe

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.*'
          arch: win64_msvc2022_arm64
      - name: Validate Qt version
        shell: pwsh
        run: ./scripts/validate_qt_version.ps1 -QtDir "$env:Qt6_DIR"
      - name: Build Windows ARM64 packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }
          $name = "RcloneBrowserNG-$version-windows-arm64"
          $dist = Join-Path $PWD "release\$name"

          cmake -S . -B build -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          cmake --build build --config Release

          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item README.md "$dist\Readme.md"
          Copy-Item CHANGELOG.md "$dist\Changelog.md"
          Copy-Item LICENSE "$dist\License.txt"
          Copy-Item build\build\Release\RcloneBrowser.exe $dist
          Copy-Item build\build\Release\RcloneBrowserPassword.exe $dist

          windeployqt --no-translations "$dist\RcloneBrowser.exe"

          $zip = Join-Path $PWD "release\$name.zip"
          Compress-Archive -Path $dist -DestinationPath $zip -Force
      - name: Smoke test packaged binary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          $exe = "release\RcloneBrowserNG-$version-windows-arm64\RcloneBrowser.exe"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $output = & $exe --version 2>&1
          Write-Host "Smoke output: $output"
          if ($output -notmatch 'Rclone Browser NG') { throw 'Smoke test failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-arm64
          path: release/*.zip

  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    needs:
      - linux-appimage
      - macos-dmg
      - windows-x64
      - windows-arm64
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Generate package-manager manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          base="https://github.com/SysAdminDoc/RcloneBrowserNG/releases/download/${tag}"
          cd dist

          win_sha=$(grep "windows-x64.zip" SHA256SUMS.txt | awk '{print $1}')
          mac_arm_sha=$(grep "macos-arm64.dmg" SHA256SUMS.txt | awk '{print $1}')
          mac_x86_sha=$(grep "macos-x86_64.dmg" SHA256SUMS.txt | awk '{print $1}')

          cat > winget-manifest.yaml << WINGET
          PackageIdentifier: SysAdminDoc.RcloneBrowserNG
          PackageVersion: "${version}"
          PackageName: Rclone Browser NG
          Publisher: SysAdminDoc
          License: MIT
          ShortDescription: Simple cross-platform GUI for the rclone command line tool
          PackageUrl: https://github.com/SysAdminDoc/RcloneBrowserNG
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: "${base}/RcloneBrowserNG-${version}-windows-x64.zip"
              InstallerSha256: "${win_sha}"
          ManifestType: singleton
          ManifestVersion: 1.6.0
          WINGET

          cat > homebrew-cask.rb << CASK
          cask "rclone-browser-ng" do
            version "${version}"
            sha256 arm:   "${mac_arm_sha}",
                   intel: "${mac_x86_sha}"
            url "https://github.com/SysAdminDoc/RcloneBrowserNG/releases/download/v#{version}/RcloneBrowserNG-#{version}-macos-#{arch == :arm64 ? "arm64" : "x86_64"}.dmg"
            name "Rclone Browser NG"
            desc "GUI for the rclone command line tool"
            homepage "https://github.com/SysAdminDoc/RcloneBrowserNG"
            app "rclone-browser.app"
          end
          CASK

          cat > scoop-manifest.json << SCOOP
          {
            "version": "${version}",
            "description": "Simple cross-platform GUI for the rclone command line tool",
            "homepage": "https://github.com/SysAdminDoc/RcloneBrowserNG",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "${base}/RcloneBrowserNG-${version}-windows-x64.zip",
                "hash": "${win_sha}"
              }
            },
            "bin": "RcloneBrowser.exe",
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/SysAdminDoc/RcloneBrowserNG/releases/download/v\$version/RcloneBrowserNG-\$version-windows-x64.zip"
                }
              }
            }
          }
          SCOOP
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "Rclone Browser NG $version" \
              --generate-notes
          fi

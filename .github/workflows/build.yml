name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream cmake clang-tidy desktop-file-utils g++ qt6-base-dev libgl1-mesa-dev
      - name: Validate desktop metadata
        run: |
          desktop-file-validate assets/io.github.sysadmindoc.rclonebrowserng.desktop
          appstreamcli validate --no-net assets/io.github.sysadmindoc.rclonebrowserng.metainfo.xml
      - name: Validate release scripts
        run: bash -n scripts/*.sh
      - name: Build
        run: |
          mkdir build && cd build
          cmake ..
          cmake --build . --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: clang-tidy
        run: |
          cd build
          run-clang-tidy -p . -header-filter='src/.*\.h$' ../src/*.cpp 2>&1 | tee clang-tidy.log
          if grep -q 'error:' clang-tidy.log; then
            echo "clang-tidy found errors"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-qt6
          path: build/build/rclone-browser

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15
            arch: x86_64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install dependencies
        run: brew install qt@6
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) ${{ matrix.cmake_extra }}
          cmake --build . --parallel
      - name: Test
        if: matrix.arch == 'arm64'
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: build/build/rclone-browser.app

  windows:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            qt_version: '6.8.*'
            arch: win64_msvc2019_64
            artifact: windows-x64
          - runner: windows-11-arm
            qt_version: '6.8.*'
            arch: win64_msvc2022_arm64
            artifact: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.arch }}
      - name: Validate Qt version
        shell: pwsh
        run: ./scripts/validate_qt_version.ps1 -QtDir "$env:Qt6_DIR"
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          rem use the runner's default Visual Studio generator - hardcoding a
          rem VS version breaks every time the windows-latest image updates
          cmake -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="%Qt6_DIR%" ..
          cmake --build . --config Release
      - name: Test
        if: matrix.artifact == 'windows-x64'
        shell: cmd
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/build/Release/RcloneBrowser.exe
            build/build/Release/RcloneBrowserPassword.exe

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream cmake desktop-file-utils g++ qt6-base-dev libgl1-mesa-dev
      - name: Validate desktop metadata
        run: |
          desktop-file-validate assets/io.github.sysadmindoc.rclonebrowserng.desktop
          appstreamcli validate --no-net assets/io.github.sysadmindoc.rclonebrowserng.metainfo.xml
      - name: Build
        run: |
          mkdir build && cd build
          cmake ..
          cmake --build . --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-qt6
          path: build/build/rclone-browser

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15
            arch: x86_64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: brew install qt@6
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) ${{ matrix.cmake_extra }}
          cmake --build . --parallel
      - name: Test
        if: matrix.arch == 'arm64'
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: build/build/rclone-browser.app

  windows:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            qt_version: '6.8.*'
            arch: win64_msvc2019_64
            artifact: windows-x64
          - runner: windows-11-arm
            qt_version: '6.8.*'
            arch: win64_msvc2022_arm64
            artifact: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.arch }}
      - name: Validate Qt version
        shell: pwsh
        run: |
          $qmake = Join-Path $env:Qt6_DIR "bin" "qmake6.exe"
          if (-not (Test-Path $qmake)) { $qmake = Join-Path $env:Qt6_DIR "bin" "qmake.exe" }
          $ver = & $qmake -query QT_VERSION
          Write-Host "Qt version: $ver"
          $parts = $ver -split '\.'
          $major = [int]$parts[0]; $minor = [int]$parts[1]; $patch = [int]$parts[2]
          # Reject Qt versions vulnerable to CVE-2026-6210: only 6.8.8+ and 6.11.1+ are patched
          $safe = ($major -gt 6) -or
                  ($major -eq 6 -and $minor -eq 8 -and $patch -ge 8) -or
                  ($major -eq 6 -and $minor -eq 11 -and $patch -ge 1) -or
                  ($major -eq 6 -and $minor -gt 11)
          if (-not $safe) {
            Write-Error "Qt $ver is in the CVE-2026-6210 vulnerable range. Require >= 6.8.8 or >= 6.11.1."
            exit 1
          }
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          rem use the runner's default Visual Studio generator - hardcoding a
          rem VS version breaks every time the windows-latest image updates
          cmake -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="%Qt6_DIR%" ..
          cmake --build . --config Release
      - name: Test
        if: matrix.artifact == 'windows-x64'
        shell: cmd
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/build/Release/RcloneBrowser.exe
            build/build/Release/RcloneBrowserPassword.exe

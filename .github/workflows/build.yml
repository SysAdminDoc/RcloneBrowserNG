name: Build Rclone Browser NG

on:
  push:
    branches:
      - main
      - master
      - build_on_github
  workflow_dispatch:

env:
  # Nur Qt-Versionen verwenden, die scripts/validate_qt_version.ps1 und die
  # README als sicher/getestet ausweisen: 6.8.8+ oder 6.11.1+ (CVE-2026-6210).
  # 6.10.3 lag außerhalb dieses Bereichs.
  QT_VERSION: '6.11.0'

jobs:
  build_windows:
    name: Windows Build (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          # FIX: 'mirror' ist kein gültiger Input für install-qt-action@v4.
          # Der Parameter wurde ignoriert, wodurch aqtinstall über einen
          # zufälligen Community-Mirror lief, der Qt 6.11.1 nicht kannte.
          # 'extra' wird direkt an aqtinstall weitergereicht.
          extra: '--base https://download.qt.io'

      - name: Validate Qt version
        shell: pwsh
        run: .\scripts\validate_qt_version.ps1 -QtDir "$env:QT_ROOT_DIR"

      - name: Build Rclone Browser
        run: |
          mkdir build
          cd build
          # Let CMake auto-detect the newest installed Visual Studio generator
          # (windows-latest ships VS 2026, not VS 2022).
          cmake -A x64 -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" ..
          cmake --build . --config Release
          # FIX: Pfad korrigiert. Da wir bereits im 'build'-Verzeichnis sind,
          # liegt das Executable unter .\Release\, nicht .\build\Release\.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --no-translations ".\Release\RcloneBrowser.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # FIX: Upload-Pfad ebenfalls korrigiert (war doppelt verschachtelt).
          path: build\Release\*

  build_linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Development Tools
        run: |
          sudo apt update
          sudo apt -y install git g++ cmake make qt6-base-dev libgl1-mesa-dev

      - name: Build Rclone Browser
        run: |
          mkdir build
          cd build
          # src/CMakeLists.txt setzt -Werror auf Linux ohne das Windows-
          # Äquivalent /wd4100. main_window.cpp hat einen Parameter
          # (errorTitle), der nur im macOS-Zweig benutzt wird -> auf Linux
          # -Werror=unused-parameter. Statt main_window.cpp zu patchen: nur
          # diese eine Warnungsklasse zurück auf "warn" statt "error" stufen,
          # der Rest von -Werror bleibt aktiv. Reihenfolge relativ zu -Werror
          # ist bei GCC irrelevant.
          # Zwei weitere Windows/Linux-Asymmetrien wie beim unused-parameter-
          # Fall: -Werror=reorder (Member-Init-Reihenfolge in item_model.h,
          # rein stilistisch) und -Werror=unused-function (credentialTarget()
          # in utils.cpp wird nur im Windows-Zweig aufgerufen). Gleiche
          # Strategie: nur diese Warnungsklassen entschärfen, Rest von
          # -Werror bleibt aktiv.
          cmake -DBUILD_TESTING=OFF -DCMAKE_CXX_FLAGS="-Wno-error=unused-parameter -Wno-error=reorder -Wno-error=unused-function" ..
          make -j $(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/build/*

